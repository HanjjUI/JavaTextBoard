<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Editor</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

.container {
    width: 900px;
    max-width: 94%;
    min-height: 720px;
    margin: 40px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #ddd;
}

.header button {
    padding: 10px 16px;
}

.title {
    flex: 1;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.content {
    flex: 1;
    padding: 30px;
    text-align: left;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font: inherit;
}

textarea {
    height: 360px;
    resize: vertical;
}

.field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    margin-bottom: 8px;
}

.field-header label {
    margin: 0;
}

.ai-tools {
    display: flex;
    align-items: center;
    gap: 10px;
}

.ai-tools select {
    width: auto;
    min-width: 120px;
    padding: 8px 10px;
}

.ai-tools button {
    padding: 8px 12px;
    background: #0f62fe;
}

.ai-tools button:disabled {
    cursor: not-allowed;
    background: #8aaef8;
}

.ai-status {
    min-width: 90px;
    color: #666;
    font-size: 13px;
    text-align: right;
}

.footer {
    padding: 16px 20px;
    border-top: 1px solid #ddd;
    text-align: right;
}

button {
    cursor: pointer;
    border: none;
    background: #2f2f2f;
    color: white;
    border-radius: 8px;
    padding: 10px 16px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <button onclick="location.href='/'">Home</button>
        <div class="title" id="pageTitle">New Post</div>
        <div></div>
    </div>

    <div class="content">
        <div class="field-header">
            <label for="title">Title / Question</label>
            <div class="ai-tools">
                <span class="ai-status" id="aiStatus"></span>
                <select id="aiLanguage" aria-label="AI answer language">
                    <option value="ja" selected>日本語</option>
                    <option value="auto">Auto</option>
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                </select>
                <button id="aiBtn" type="button" onclick="generateAiAnswer()">AI Answer</button>
            </div>
        </div>
        <input id="title">

        <label for="pdfFile">PDF Attachment</label>
        <input id="pdfFile" type="file" accept="application/pdf">
        <input id="imageUrl" type="hidden">

        <label for="content">Content</label>
        <textarea id="content"></textarea>
    </div>

    <div class="footer">
        <button id="submitBtn" onclick="submitPost()">Save</button>
    </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const editId = params.get("id");

if (editId) {
    document.getElementById("pageTitle").innerText = "Edit Post";
    document.getElementById("submitBtn").innerText = "Update";

    fetch(`/board/${editId}?increaseViewCount=false`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("title").value = data.title || "";
            document.getElementById("imageUrl").value = data.imageUrl || "";
            document.getElementById("content").value = data.content || "";
        })
        .catch(() => {
            alert("Could not load the post.");
            location.href = "/";
        });
}

async function submitPost() {
    const title = document.getElementById("title").value.trim();
    let imageUrl = document.getElementById("imageUrl").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        alert("Title and content are required.");
        return;
    }

    const method = editId ? "PUT" : "POST";
    const url = editId ? `/board/${editId}` : "/board/write";

    try {
        imageUrl = await uploadPdfIfSelected(imageUrl);
    } catch (error) {
        alert(error.message);
        return;
    }

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            imageUrl: imageUrl,
            content: content
        })
    })
        .then(res => res.text())
    .then(data => {
        if (data === "OK") {
            alert(editId ? "Post updated." : "Post created.");
            location.href = "/";
            return;
        }

        if (data === "LOGIN_REQUIRED") {
            alert("Login is required.");
            location.href = "/login";
            return;
        }

        alert(editId ? "Could not update the post." : "Could not create the post.");
    })
    .catch(() => {
        alert("Could not reach the server.");
    });
}

async function uploadPdfIfSelected(currentUrl) {
    const fileInput = document.getElementById("pdfFile");
    const file = fileInput.files[0];

    if (!file) {
        return currentUrl;
    }

    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        throw new Error("Only PDF files can be attached.");
    }

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/board/upload", {
        method: "POST",
        body: formData
    });
    const result = await res.text();

    if (result === "LOGIN_REQUIRED") {
        location.href = "/login";
        throw new Error("Login is required.");
    }

    if (result === "INVALID_FILE") {
        throw new Error("Only PDF files can be attached.");
    }

    if (!res.ok) {
        throw new Error("Could not upload the PDF.");
    }

    return result;
}

function setAiLoading(isLoading) {
    document.getElementById("aiBtn").disabled = isLoading;
    document.getElementById("aiLanguage").disabled = isLoading;
    document.getElementById("aiStatus").innerText = isLoading ? "Writing..." : "";
}

function generateAiAnswer() {
    const question = document.getElementById("title").value.trim();
    const language = document.getElementById("aiLanguage").value;
    const content = document.getElementById("content");

    if (!question) {
        alert("Enter a title or question first.");
        return;
    }

    setAiLoading(true);

    fetch("/ai/answer", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: question,
            language: language
        })
    })
    .then(res => {
        return res.json().then(data => {
            if (!res.ok) {
                throw new Error(data.message || "Could not generate an AI answer.");
            }
            return data;
        });
    })
    .then(data => {
        content.value = data.answer || "";
        content.focus();
    })
    .catch(error => {
        alert(error.message);
    })
    .finally(() => {
        setAiLoading(false);
    });
}
</script>

</body>
</html>

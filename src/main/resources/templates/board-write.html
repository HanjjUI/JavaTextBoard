<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿作成</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

.container {
    width: 900px;
    max-width: 94%;
    min-height: 720px;
    margin: 40px auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
}

.header {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #ddd;
}

.header button {
    padding: 10px 16px;
}

.title {
    flex: 1;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

.content {
    flex: 1;
    padding: 30px;
    text-align: left;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font: inherit;
}

textarea {
    height: 360px;
    resize: vertical;
}

.field-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    margin-bottom: 8px;
}

.field-header label {
    margin: 0;
}

.ai-tools {
    display: flex;
    align-items: center;
    gap: 10px;
}

.ai-tools select {
    width: auto;
    min-width: 120px;
    padding: 8px 10px;
}

.ai-tools button {
    padding: 8px 12px;
    background: #0f62fe;
}

.ai-tools button:disabled {
    cursor: not-allowed;
    background: #8aaef8;
}

.ai-status {
    min-width: 90px;
    color: #666;
    font-size: 13px;
    text-align: right;
}

.attachment-preview {
    display: none;
    margin-top: 10px;
}

.attachment-preview img {
    display: block;
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.attachment-name {
    margin-top: 8px;
    color: #666;
    font-size: 13px;
}

.footer {
    padding: 16px 20px;
    border-top: 1px solid #ddd;
    text-align: right;
}

button {
    cursor: pointer;
    border: none;
    background: #2f2f2f;
    color: white;
    border-radius: 8px;
    padding: 10px 16px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <button onclick="location.href='/'">ホーム</button>
        <div class="title" id="pageTitle">新規投稿</div>
        <div></div>
    </div>

    <div class="content">
        <div class="field-header">
            <label for="title">タイトル / 質問</label>
            <div class="ai-tools">
                <span class="ai-status" id="aiStatus"></span>
                <select id="aiLanguage" aria-label="AI回答言語">
                    <option value="ja" selected>日本語</option>
                    <option value="auto">自動</option>
                    <option value="ko">韓国語</option>
                    <option value="en">英語</option>
                </select>
                <button id="aiBtn" type="button" onclick="generateAiAnswer()">AIで本文作成</button>
            </div>
        </div>
        <input id="title">

        <label for="attachmentFile">添付ファイル</label>
        <input id="attachmentFile" type="file" accept="application/pdf,image/*,.exe">
        <div class="attachment-preview" id="attachmentPreview">
            <img id="attachmentPreviewImage" alt="">
            <div class="attachment-name" id="attachmentName"></div>
        </div>
        <input id="imageUrl" type="hidden">

        <label for="content">本文</label>
        <textarea id="content"></textarea>
    </div>

    <div class="footer">
        <button id="submitBtn" onclick="submitPost()">保存</button>
    </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const editId = params.get("id");

if (editId) {
    document.getElementById("pageTitle").innerText = "投稿編集";
    document.getElementById("submitBtn").innerText = "更新";

    fetch(`/board/${editId}?increaseViewCount=false`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("title").value = data.title || "";
            document.getElementById("imageUrl").value = data.imageUrl || "";
            document.getElementById("content").value = data.content || "";
        })
        .catch(() => {
            alert("投稿を読み込めませんでした。");
            location.href = "/";
        });
}

async function submitPost() {
    const title = document.getElementById("title").value.trim();
    let imageUrl = document.getElementById("imageUrl").value.trim();
    const content = document.getElementById("content").value.trim();

    if (!title || !content) {
        alert("タイトルと本文を入力してください。");
        return;
    }

    const method = editId ? "PUT" : "POST";
    const url = editId ? `/board/${editId}` : "/board/write";

    try {
        imageUrl = await uploadAttachmentIfSelected(imageUrl);
    } catch (error) {
        alert(error.message);
        return;
    }

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: title,
            imageUrl: imageUrl,
            content: content
        })
    })
        .then(res => res.text())
    .then(data => {
        if (data === "OK") {
            alert(editId ? "投稿を更新しました。" : "投稿を作成しました。");
            location.href = "/";
            return;
        }

        if (data === "LOGIN_REQUIRED") {
            alert("ログインが必要です。");
            location.href = "/login";
            return;
        }

        alert(editId ? "投稿を更新できませんでした。" : "投稿を作成できませんでした。");
    })
    .catch(() => {
        alert("サーバーに接続できませんでした。");
    });
}

async function uploadAttachmentIfSelected(currentUrl) {
    const fileInput = document.getElementById("attachmentFile");
    const file = fileInput.files[0];

    if (!file) {
        return currentUrl;
    }

    if (!isAllowedAttachment(file)) {
        throw new Error("PDF、画像、EXEファイルのみ添付できます。");
    }

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/board/upload", {
        method: "POST",
        body: formData
    });
    const result = await res.text();

    if (result === "LOGIN_REQUIRED") {
        location.href = "/login";
        throw new Error("ログインが必要です。");
    }

    if (result === "INVALID_FILE") {
        throw new Error("PDF、画像、EXEファイルのみ添付できます。");
    }

    if (!res.ok) {
        throw new Error("添付ファイルをアップロードできませんでした。");
    }

    return result;
}

function isAllowedAttachment(file) {
    const filename = file.name.toLowerCase();
    return filename.endsWith(".pdf")
            || filename.endsWith(".jpg")
            || filename.endsWith(".jpeg")
            || filename.endsWith(".png")
            || filename.endsWith(".gif")
            || filename.endsWith(".webp")
            || filename.endsWith(".exe");
}

function isImageFile(file) {
    const filename = file.name.toLowerCase();
    return file.type.startsWith("image/")
            || filename.endsWith(".jpg")
            || filename.endsWith(".jpeg")
            || filename.endsWith(".png")
            || filename.endsWith(".gif")
            || filename.endsWith(".webp");
}

function updateAttachmentPreview() {
    const fileInput = document.getElementById("attachmentFile");
    const preview = document.getElementById("attachmentPreview");
    const image = document.getElementById("attachmentPreviewImage");
    const name = document.getElementById("attachmentName");
    const file = fileInput.files[0];

    image.removeAttribute("src");
    image.style.display = "none";
    name.innerText = "";

    if (!file) {
        preview.style.display = "none";
        return;
    }

    preview.style.display = "block";
    name.innerText = file.name;

    if (isImageFile(file)) {
        image.src = URL.createObjectURL(file);
        image.style.display = "block";
    }
}

document.getElementById("attachmentFile").addEventListener("change", updateAttachmentPreview);

function setAiLoading(isLoading) {
    document.getElementById("aiBtn").disabled = isLoading;
    document.getElementById("aiLanguage").disabled = isLoading;
    document.getElementById("aiStatus").innerText = isLoading ? "作成中..." : "";
}

function generateAiAnswer() {
    const question = document.getElementById("title").value.trim();
    const language = document.getElementById("aiLanguage").value;
    const content = document.getElementById("content");

    if (!question) {
        alert("先にタイトルまたは質問を入力してください。");
        return;
    }

    setAiLoading(true);

    fetch("/ai/answer", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            question: question,
            language: language
        })
    })
    .then(res => {
        return res.json().then(data => {
            if (!res.ok) {
                throw new Error(data.message || "AI本文を作成できませんでした。");
            }
            return data;
        });
    })
    .then(data => {
        content.value = data.answer || "";
        content.focus();
    })
    .catch(error => {
        alert(error.message);
    })
    .finally(() => {
        setAiLoading(false);
    });
}
</script>

</body>
</html>

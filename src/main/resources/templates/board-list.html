<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background-color: #f5f5f5;
        }

        a {
            text-decoration: none;
            color: #333;
        }

        button {
            margin-top: 15px;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Post List</h2>

<button onclick="location.href='/board/write'">New Post</button>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Created</th>
            <th>Views</th>
        </tr>
    </thead>

    <tbody id="list"></tbody>
</table>

<script>
fetch("/board/list")
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById("list");

        if (data.length === 0) {
            list.innerHTML = "<tr><td colspan='5'>No posts yet.</td></tr>";
            return;
        }

        data.forEach(board => {
            list.innerHTML +=
                "<tr>" +
                "<td>" + board.id + "</td>" +
                "<td><a href='/board/" + board.id + "'>" + board.title + "</a></td>" +
                "<td>" + board.author + "</td>" +
                "<td>" + (board.createdAt ? board.createdAt.replace('T', ' ').substring(0, 16) : '') + "</td>" +
                "<td>" + board.viewCount + "</td>" +
                "</tr>";
        });
    })
    .catch(() => {
        document.getElementById("list").innerHTML =
            "<tr><td colspan='5'>Could not load posts.</td></tr>";
    });
</script>

</body>
</html>
